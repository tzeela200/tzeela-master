<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#CC0C6C" />
    <title>צאלה — אין חיבור</title>
    <style>
      :root { --primary: #cc0c6c; --bg: #f7f8f6; --text: #1d2327; --muted: #5f6b73; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: var(--bg); color: var(--text);
        font-family: Heebo, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      }
      main {
        width: 100%; max-width: 380px; text-align: center; background: #fff; border-radius: 22px;
        padding: 32px 24px; box-shadow: 0 1px 2px rgb(16 24 20 / 0.04), 0 4px 16px rgb(16 24 20 / 0.05);
      }
      h1 { margin: 0 0 8px; font-size: 24px; color: var(--primary); }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
      button {
        min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: var(--primary);
        color: #fff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>צאלה</h1>
      <p>אין כרגע חיבור לאינטרנט.<br />כשהחיבור יחזור, אפשר לנסות שוב.</p>
      <button type="button" onclick="location.reload()">נסה שוב</button>
    </main>
  </body>
</html>
